<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 4 - Additional Information</title>
  <link rel="stylesheet" href="/styles/step4.css" />
</head>
<body>
  <div class="form-container">
    <h2>Step 4</h2>
    <p>Additional information and requirements.</p>
    
    <form id="additionalForm">
      <div class="form-group">
        <label for="experience">Years of driving experience:</label>
        <select id="experience" name="experience" required>
          <option value="">Select years</option>
          <option value="0-2">0-2 years</option>
          <option value="3-5">3-5 years</option>
          <option value="6-10">6-10 years</option>
          <option value="10+">10+ years</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="violations">Any moving violations in the last 3 years?</label>
        <div class="radio-group">
          <label><input type="radio" name="violations" value="yes"> Yes</label>
          <label><input type="radio" name="violations" value="no" checked> No</label>
        </div>
      </div>
      
      <div class="form-group">
        <label for="accidents">Any accidents in the last 5 years?</label>
        <div class="radio-group">
          <label><input type="radio" name="accidents" value="yes"> Yes</label>
          <label><input type="radio" name="accidents" value="no" checked> No</label>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
