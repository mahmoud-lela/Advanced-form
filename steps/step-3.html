<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 3 - Coverage Selection</title>
  <link rel="stylesheet" href="styles/step3.css" />
  </head>
<body>
  <div class="form-container">
    <h2>Step 3</h2>
    <p>What coverage(s) would you like to apply for?</p>
    <form id="coverageForm">
      <div class="checkbox-list">
        <label>
          <input type="checkbox" id="occupationalAccident" name="coverage" value="Occupational Accident">
          Occupational Accident
        </label>
        <label>
          <input type="checkbox" id="physicalDamage" name="coverage" value="Physical Damage">
          Physical Damage
        </label>
        <label>
          <input type="checkbox" id="nonTruckingLiability" name="coverage" value="Non-Trucking Liability">
          Non-Trucking Liability
        </label>
        <label>
          <input type="checkbox" id="workersCompensation" name="coverage" value="Workers Compensation">
          Workers Compensation
        </label>
        <label>
          <input type="checkbox" id="occupationalCompensation" name="coverage" value="Occupational Compensation">
          Occupational Compensation
        </label>
      </div>
    </form>
  </div>
</body>
</html>
